services:
  api:
    build:
      context: .
      target: api
    # Default: the synthetic demo dataset baked into the image. To serve a locally
    # generated real dataset instead, uncomment (it stays on your machine):
    # environment:
    #   VENUE_ACCESS_DB: /data/venue_access.duckdb
    #   VENUE_ACCESS_MODE: local
    # volumes:
    #   - ./backend/data/published:/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/ready',timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on: [api, web]
    profiles: ["prod"]

volumes:
  caddy-data:
