[project]
name = "venue-access"
version = "0.1.0"
description = "Public evidence of observed European trading-venue membership"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "typer>=0.12.5",
    "uvicorn>=0.30.0",
    "rich>=13.8.0",
    "pyyaml>=6.0.2",
    "selectolax>=0.3.25",
    "email-validator>=2.2.0",
    "pytz>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.22.0",
    "hypothesis>=6.112.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
venue-access = "venue_access.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["venue_access"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"venue_access/cli/**" = ["B008"]  # typer.Option/Argument defaults are the typer idiom

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["duckdb", "selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit real network sources (deselect with -m 'not live')",
]
addopts = "-m 'not live'"
